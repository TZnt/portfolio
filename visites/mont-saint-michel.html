    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: #0a0e17;
        font-family: 'Inter', system-ui, sans-serif;
      }
      #app {
        position: fixed;
        inset: 0;
      }
      #app canvas {
        display: block;
        touch-action: none;
      }

      #loader {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 18px;
        background: radial-gradient(120% 120% at 50% 30%, #141c30 0%, #0a0e17 70%);

        z-index: 10;
        transition: opacity 0.8s ease;
      }
      #loader.done {
        opacity: 0;

      }
      #loader h1 {
        font-family: 'Cormorant Garamond', Georgia, serif;
        font-weight: 600;
        font-size: clamp(28px, 5vw, 44px);
        letter-spacing: 0.04em;
        margin: 0;
      }
      #loader p {
        margin: 0;
        font-size: 13px;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        color: #8d94a8;
      }
      #bar {
        width: min(320px, 70vw);
        height: 2px;
        background: rgba(255, 255, 255, 0.12);
        border-radius: 2px;
        overflow: hidden;
      }
      #bar > div {
        height: 100%;
        width: 0%;
        background: #d8b96a;
        transition: width 0.2s ease;
      }

      #credit {
        position: fixed;
        left: 12px;
        bottom: 10px;
        z-index: 5;
        font-size: 11px;
        color: rgba(232, 228, 216, 0.45);
        letter-spacing: 0.02em;
      }
      #credit a {
        color: rgba(216, 185, 106, 0.75);
        text-decoration: none;
      }
    </style>
